<svg width="900" height="750" viewBox="0 0 900 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft radial ambient glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#D7E4FB" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#E5EEFC" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#F2F6FE" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FAFAF9" stop-opacity="0" />
    </radialGradient>

    <!-- Outer ribbon gradient -->
    <linearGradient id="outerRibbon" x1="0%" y1="80%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#C5D8F8" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#DCE7FA" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#EDF3FD" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E2EDFC" stop-opacity="0.5" />
    </linearGradient>

    <!-- Inner ribbon gradient -->
    <linearGradient id="innerRibbon" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#E4EEFC" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#C8DAF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#B8CEF5" stop-opacity="0.75" />
    </linearGradient>

    <!-- Gaussian blur for ultra-smooth transition -->
    <filter id="ribbonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
    </filter>
  </defs>

  <!-- Ambient background glow behind portrait -->
  <ellipse cx="480" cy="380" rx="420" ry="340" fill="url(#ambientGlow)" />

  <!-- Outer sweeping ring ribbon (matches reference curve) -->
  <path
    d="M 60 480 C 40 280, 200 80, 480 60 C 740 40, 880 180, 860 420 C 840 580, 720 680, 560 670 C 400 660, 280 560, 260 440 C 240 320, 360 180, 520 180 C 660 180, 780 280, 760 420"
    fill="none"
    stroke="url(#outerRibbon)"
    stroke-width="130"
    stroke-linecap="round"
    filter="url(#ribbonBlur)"
  />

  <!-- Secondary luminous inner arch -->
  <path
    d="M 160 440 C 180 220, 360 120, 560 130 C 760 140, 860 260, 830 460 C 800 620, 680 700, 520 680"
    fill="none"
    stroke="url(#innerRibbon)"
    stroke-width="70"
    stroke-linecap="round"
    filter="url(#ribbonBlur)"
    opacity="0.85"
  />
</svg>

